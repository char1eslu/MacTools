name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: MacTools
  SCHEME: MacTools
  DERIVED_DATA: build/DerivedData
  CI_BUNDLE_IDENTIFIER_PREFIX: dev.mactools.ci

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Write CI local config
        run: |
          cat > LocalConfig.xcconfig <<EOF
          DEVELOPMENT_TEAM =
          BUNDLE_IDENTIFIER_PREFIX = ${CI_BUNDLE_IDENTIFIER_PREFIX}
          EOF

      - name: Generate Xcode project
        run: make generate

      - name: Build and run tests
        run: |
          xcodebuild \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "${DERIVED_DATA}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            test \
            -quiet

      - name: Package Debug app artifact
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          PRODUCTS_DIR="${DERIVED_DATA}/Build/Products/Debug"
          APP_PATH="${PRODUCTS_DIR}/MacTools Dev.app"
          ARTIFACT_ROOT="build/debug-artifact/MacTools-Debug"

          find "$PRODUCTS_DIR" -maxdepth 1 -name "*.bundle" -type d -print0 | while IFS= read -r -d '' bundle; do
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict "$bundle"
          done

          if [[ -d "$APP_PATH/Contents/Frameworks" ]]; then
            find "$APP_PATH/Contents/Frameworks" -type d \( -name "*.framework" -o -name "*.xpc" \) -print0 | while IFS= read -r -d '' item; do
              codesign --force --deep --sign - "$item"
            done
          fi

          codesign --force --deep --sign - --entitlements Configs/MacTools.entitlements "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

          ./scripts/plugins/sync-debug-plugins.sh \
            --source-dir Plugins \
            --products-dir "$PRODUCTS_DIR" \
            --output-dir build/LocalPlugins \
            --skip-install

          rm -rf build/debug-artifact
          mkdir -p "$ARTIFACT_ROOT"
          ditto "$APP_PATH" "$ARTIFACT_ROOT/MacTools Dev.app"
          ditto build/LocalPlugins "$ARTIFACT_ROOT/LocalPlugins"

          cat > "$ARTIFACT_ROOT/run-debug.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "$0")" && pwd)"
          LOCAL_CATALOG_PATH="$ROOT/LocalPlugins/catalog.local.json"
          PACKAGES_DIR="$ROOT/LocalPlugins/Packages"
          INSTALL_DIR="$HOME/Library/Application Support/MacTools Dev/Plugins/Installed"

          /usr/bin/ruby -rjson -ruri -e '
            root = ARGV.fetch(0)
            catalog_path = File.join(root, "LocalPlugins", "catalog.dev.json")
            output_path = File.join(root, "LocalPlugins", "catalog.local.json")
            catalog = JSON.parse(File.read(catalog_path))
            (catalog["plugins"] || []).each do |plugin|
              package = plugin["package"] || {}
              package_path = File.expand_path(File.join(root, "LocalPlugins", "Packages", "#{plugin.fetch("id")}.mactoolsplugin"))
              package["url"] = URI::DEFAULT_PARSER.escape("file://#{package_path}")
            end
            File.write(output_path, JSON.pretty_generate(catalog))
          ' "$ROOT"

          mkdir -p "$INSTALL_DIR"
          find "$PACKAGES_DIR" -maxdepth 1 -name "*.mactoolsplugin" -type d -print0 | while IFS= read -r -d '' package; do
            destination="$INSTALL_DIR/$(basename "$package")"
            staging="$INSTALL_DIR/.$(basename "$package").syncing.$$"
            rm -rf "$staging"
            ditto "$package" "$staging"
            rm -rf "$destination"
            mv "$staging" "$destination"
          done

          LOCAL_CATALOG_URL="$(/usr/bin/ruby -ruri -e 'puts URI::DEFAULT_PARSER.escape("file://#{File.expand_path(ARGV.fetch(0))}")' "$LOCAL_CATALOG_PATH")"
          export MACTOOLS_PLUGIN_CATALOG_URL="$LOCAL_CATALOG_URL"
          open "$ROOT/MacTools Dev.app"
          EOF
          chmod +x "$ARTIFACT_ROOT/run-debug.sh"

          cat > "$ARTIFACT_ROOT/README.txt" <<'EOF'
          This is an unsigned Debug build for local testing.

          Run ./run-debug.sh to launch MacTools Dev with the bundled local plugin catalog.
          If macOS blocks the app because it was downloaded from the internet, remove quarantine:

              xattr -dr com.apple.quarantine "MacTools Dev.app"

          Then run ./run-debug.sh again.
          EOF

          (cd build/debug-artifact && ditto -c -k --sequesterRsrc --keepParent MacTools-Debug MacTools-Debug.zip)

      - name: Upload Debug app artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MacTools-Debug
          path: build/debug-artifact/MacTools-Debug.zip
          if-no-files-found: error

      - name: Build unsigned Release app
        if: github.event_name != 'pull_request'
        run: |
          xcodebuild \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "${DERIVED_DATA}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build \
            -quiet

      - name: Build ActivityBar debug plugin package
        if: github.event_name != 'pull_request'
        run: |
          scripts/plugins/build-local-plugins.sh \
            --source-dir Plugins \
            --output-dir build/LocalPlugins \
            --configuration Debug \
            --destination "platform=macOS" \
            --plugin activity-bar \
            --unsigned-build

          codesign --force --deep --sign - \
            build/LocalPlugins/Packages/activity-bar.mactoolsplugin/ActivityBar.bundle

          scripts/plugins/generate-plugin-catalog.sh \
            --mode debug \
            --output build/LocalPlugins/catalog.dev.json \
            --package build/LocalPlugins/Packages/activity-bar.mactoolsplugin

      - name: Prepare debug downloads
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          ARTIFACTS_DIR="build/artifacts"
          DEBUG_DOWNLOAD_DIR="build/debug-download"
          DEBUG_APP="${DERIVED_DATA}/Build/Products/Debug/MacTools Dev.app"
          RELEASE_APP="${DERIVED_DATA}/Build/Products/Release/MacTools.app"

          rm -rf "${ARTIFACTS_DIR}" "${DEBUG_DOWNLOAD_DIR}"
          mkdir -p "${ARTIFACTS_DIR}" "${DEBUG_DOWNLOAD_DIR}/LocalPlugins"

          ditto "${DEBUG_APP}" "${DEBUG_DOWNLOAD_DIR}/MacTools Dev.app"
          ditto "build/LocalPlugins/Packages" "${DEBUG_DOWNLOAD_DIR}/LocalPlugins/Packages"
          cp scripts/plugins/generate-plugin-catalog.sh "${DEBUG_DOWNLOAD_DIR}/generate-plugin-catalog.sh"
          chmod +x "${DEBUG_DOWNLOAD_DIR}/generate-plugin-catalog.sh"

          cat > "${DEBUG_DOWNLOAD_DIR}/run-debug.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          ROOT="$(cd "$(dirname "$0")" && pwd)"
          CATALOG_PATH="${ROOT}/LocalPlugins/catalog.dev.json"
          PACKAGE_PATH="${ROOT}/LocalPlugins/Packages/activity-bar.mactoolsplugin"
          APP_PATH="${ROOT}/MacTools Dev.app"
          APP_EXECUTABLE="${APP_PATH}/Contents/MacOS/MacTools Dev"

          "${ROOT}/generate-plugin-catalog.sh" \
            --mode debug \
            --output "${CATALOG_PATH}" \
            --package "${PACKAGE_PATH}"

          xattr -dr com.apple.quarantine "${APP_PATH}" "${ROOT}/LocalPlugins" 2>/dev/null || true

          echo "Using plugin catalog: file://${CATALOG_PATH}"
          MACTOOLS_PLUGIN_CATALOG_URL="file://${CATALOG_PATH}" "${APP_EXECUTABLE}"
          SH
          chmod +x "${DEBUG_DOWNLOAD_DIR}/run-debug.sh"

          cat > "${DEBUG_DOWNLOAD_DIR}/README-debug.txt" <<'TXT'
          ActivityBar 调试包

          1. 解压 MacTools-ActivityBar-debug.zip。
          2. 在终端进入解压目录，运行 ./run-debug.sh。
          3. 脚本会按当前路径重新生成 LocalPlugins/catalog.dev.json，并用 file:// catalog 启动 MacTools Dev。

          注意：直接双击 MacTools Dev.app 不会带上 MACTOOLS_PLUGIN_CATALOG_URL。
          TXT

          ditto -c -k --sequesterRsrc --keepParent \
            "${DEBUG_DOWNLOAD_DIR}" \
            "${ARTIFACTS_DIR}/MacTools-ActivityBar-debug.zip"

          ditto -c -k --sequesterRsrc --keepParent \
            "${RELEASE_APP}" \
            "${ARTIFACTS_DIR}/MacTools-Release-unsigned.zip"

          ls -lah "${ARTIFACTS_DIR}"

      - name: Upload debug artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MacTools-debug-${{ github.sha }}
          path: build/artifacts/*
          if-no-files-found: error
          retention-days: 14
